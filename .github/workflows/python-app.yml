name: SG_proj_014 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
    - name: Checkout SG_sys
      uses: actions/checkout@v3
      with:
        repository: HyunchanAn/SG_sys
        path: SG_sys

      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      env:
        PYTHONPATH: ${{ github.workspace }}/SG_sys/shared_schemas

      run: |
        python -m pip install --upgrade pip
        if [ -f pyproject.toml ]; then pip install -e ".[dev]"; elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff mypy pytest pytest-cov
        
    - name: Lint with Ruff
      env:
        PYTHONPATH: ${{ github.workspace }}/SG_sys/shared_schemas

      run: |
        ruff check . || true
        
    - name: Type check with mypy
      env:
        PYTHONPATH: ${{ github.workspace }}/SG_sys/shared_schemas

      run: |
        mypy . || true
        
    - name: Run tests with pytest
      env:
        PYTHONPATH: ${{ github.workspace }}/SG_sys/shared_schemas

      run: |
        pytest --cov=.
